# ---------------------------------------------------------------------------
# DeepStream nvtracker (NvDCF) configuration
#
# Section 2 of the system block diagram: the `nvtracker` element in a DeepStream
# worker node, one per node, tracking ~13 batched streams at a time.
#
# WHY THIS FILE EXISTS
# --------------------
# The Python trackers in `anti_uav.tracking.local` (SORT / ByteTrack / BoT-SORT)
# are what we can *measure* - they are the ones the offline benchmark scores. NvDCF
# is what we would *deploy*, and it is not a Python library: it lives inside the
# DeepStream plugin runtime and cannot be executed on a development box.
#
# So this is a real, loadable config, and the Python side is a measured stand-in.
# The two are deliberately not claimed to be equivalent: NvDCF uses appearance
# and shape features from a TensorRT network but no ReID model, so it costs far
# less GPU time than BoT-SORT while being less robust on identity. Which one wins
# on your footage is an empirical question, and the way to answer it is to run the
# BoT-SORT / no-ReID ablation offline and compare HOTA.
#
# Verify this file against your DeepStream version - key names move between 6.x
# and 7.x.
# ---------------------------------------------------------------------------

# GPU used for inference. The block diagram runs 8 nodes; each owns its own.
gpu-id: 0

# ---------------------------------------------------------------------------
# Tracker configuration
# ---------------------------------------------------------------------------
[tracker]
# NVDCF is the DeepStream Neural Network Discriminative Correlation Filter
# tracker. Alternatives: KCF (cheaper, less accurate) and IOU (cheapest, no
# appearance at all).
tracker-type: 3

# Bounding-box and feature-map size. 32x32 is the default and is appropriate for
# targets of tens of pixels; raising it costs VRAM linearly and buys nothing for a
# 12 px drone, whose feature map is noise at 64x64.
width: 32
height: 32
template-size: 2
search-size: 5

# Number of trackers. Must be >= the largest number of simultaneous targets in any
# single batched frame. Set from the detector's max-detections in
# configs/app.yaml; 100 is the current value.
num-targets: 100

# ---------------------------------------------------------------------------
# Feature extraction network
# ---------------------------------------------------------------------------
[feature]
# Name of the NvDCF feature extractor built into DeepStream. "resnet18" is the
# default and is what the config below is written for.
feature-type: resnet18
# GPU this network runs on. Same GPU as the tracker by default.
gpu-id: 0
# Half precision. Correct for Jetson Thor/Orin; set 0 on Pascal, which has no
# usable fp16 path (see docs/ENVIRONMENT.md).
half-precision: 1
# Batch size for the feature network, sized to the number of tracks.
feature-batch-size: 64

# ---------------------------------------------------------------------------
# Correlation filters - the appearance model
# ---------------------------------------------------------------------------
[filter]
# NvDCF's channel count. Raising it sharpens discrimination and costs VRAM and
# compute. 256 is the default and is a good fit for small targets; the offline
# ablation is the right way to justify a change.
channel: 256
# Temporal correlation: how much of the previous frame's filter is reused. Higher
# values stabilise identity through brief occlusions and are slower to adapt to a
# real change (which for us means a handoff, where we *want* fast adaptation).
response-gain: 1.0

# ---------------------------------------------------------------------------
# Tracker output - what the message probe reads
# ---------------------------------------------------------------------------
[output]
# Emitted per tracked object: frame, source id, object id, rectangle, confidence.
# The `global track manager` subscribes to this on the message bus; the per-camera
# id is NOT the global identity.
# See ../probes.py for the probe that renders it.
# display-tracking-id: true

# ---------------------------------------------------------------------------
# Multi-stream / multi-object behaviour
# ---------------------------------------------------------------------------
[process]
# When several objects are close, NvDCF uses this to avoid the filter for one
# absorbing another. 1 = associate greedily by confidence.
# 0 keeps the overlapping filters but resolves collisions with NMS, which is what
# we want for a drone crossing a bird: the two must stay separate identities.
overlap-handling: 0

# How long a track survives without a match, in frames. The block diagram's
# maxTargetAge is 4 frames at 30 fps = 133 ms, which is deliberately shorter than
# one PTZ move - recovery has to start before the old track dies.
max-missing-frames: 4

# Tracks below this height are reported as lost regardless of the missing-frame
# budget. Mirrors rules.tracking.min_trackable_height_px.
min-height: 15

# ---------------------------------------------------------------------------
# Relationship to the Python tracker used for benchmarking
# ---------------------------------------------------------------------------
# Offline (what we measure):  anti_uav.tracking.local.bytetrack / botsort
# On-device (what we deploy): this file
#
# The offline numbers are NOT an on-device estimate. Before quoting them as such,
# run the ablation:
#     anti-uav track-eval --dataset mmuav --tracker botsort --no-reid
#     anti-uav track-eval --dataset mmuav --tracker botsort --with-reid
# and check that the no-ReID variant is close. If it is, NvDCF is the right
# deployment choice; if it is much worse, the ReID model has to move on-device.
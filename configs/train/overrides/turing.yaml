# ---------------------------------------------------------------------------
# Turing profile - T4 (sm_75, 16 GB), the Kaggle / Colab card.
#
# WHY THIS PROFILE EXISTS: sm_75 used to be folded into `pascal`, which forced
# AMP off and pinned batch 8. That is wrong for a T4. Turing has full fp16
# tensor cores - fp16 is the reason the card exists - so AMP on is a large
# throughput win, not a risk. Treating it as Pascal threw that away.
#
# 16 GB is half a 3090, so batch is an absolute number rather than AutoBatch:
# `batch: -1` resolves as a FRACTION of free VRAM, and ultralytics rejects a
# fractional batch outright when more than one GPU is present
# (`engine/trainer.py`: "AutoBatch with batch<1 not supported for Multi-GPU").
# A concrete integer also happens to be divisible by 2, which DDP wants.
#
# workers: Kaggle gives 4 CPU cores. The override used to say 8, and ultralytics
# opens `workers * world_size` processes, so two GPUs meant 16 dataloader
# workers on 4 cores - a thrashing, fork-heavy mess. 2 keeps that product at 4.
# ---------------------------------------------------------------------------
profile: turing

min_torch_cuda: "11.8"

# torch.cuda.get_device_capability() -> (7, 5)
target_capability: "7.5"

batch_scale: 1.0
imgsz_scale: 1.0

force_amp: true
# 32 for YOLO11n (2.6 M params). RT-DETR-x2 is 42.3 M with a hybrid encoder and
# 100 denoising queries, whose activations dominate memory - it halves. Both are
# even so DDP leaves no rank idle.
force_batch: 32
force_batch_by_model:
  rtdetr_x2: 16
force_imgsz: 640
workers: 2

notes: >-
  Kaggle T4x2 and Colab T4. YOLO11n at batch 32 / 640 px with AMP is roughly
  10-14 it/s per GPU; RT-DETR-x2 is roughly 0.3-0.5 s/it at batch 32 across
  both ranks, so the T4 handles both models, just at very different cost.

  Two GPUs under DDP give a real but sub-2x speedup on YOLO11n, and closer to
  1.8x on RT-DETR-x2 (a T4 at batch 16/rank is not saturated). Expect roughly
  1.5-3 h for YOLO11n at 120 epochs and 4-6 h for RT-DETR-x2 at 100 epochs on
  the dvb combo (~17.9k frames, 15.2k of them train). Both fit a single Kaggle
  12 h session; together they leave little margin for a re-run.

  If you OOM, halve the batch before touching anything else - memory here
  scales with the hybrid encoder's activations and the denoising query count,
  not with the backbone.